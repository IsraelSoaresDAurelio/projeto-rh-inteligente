services:
  - type: web
    name: rh-inteligente
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: IA_PROVIDER
        value: ollama
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
